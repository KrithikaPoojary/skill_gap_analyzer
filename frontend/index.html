<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge — Skill Gap Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Authentication Views -->
<div id="auth-page" class="auth-wrapper">
  <div class="auth-glow"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </span>
      <span class="logo-text">Skill<b>Bridge</b></span>
    </div>

    <!-- Login Form -->
    <div id="login-form">
      <h2>Welcome back</h2>
      <p class="auth-sub">Sign in to your candidate account</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <div id="login-error" class="error-msg"></div>
      <button class="btn-primary" onclick="login()">Sign In</button>
      <p class="auth-switch">Don't have an account? <a href="#" onclick="showRegister()">Create one</a></p>
    </div>

    <!-- Register Form -->
    <div id="register-form" style="display:none">
      <h2>Create account</h2>
      <p class="auth-sub">Start your personalized skill gap analysis</p>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Krithika Poojary" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min 8 characters" />
      </div>
      <div id="reg-error" class="error-msg"></div>
      <button class="btn-primary" onclick="register()">Create Account</button>
      <p class="auth-switch">Already have an account? <a href="#" onclick="showLogin()">Sign in</a></p>
    </div>
  </div>
</div>

<!-- Main Application Layout -->
<div id="app" style="display:none" class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </span>
      <span class="logo-text">Skill<b>Bridge</b></span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" onclick="showPage('dashboard',this)" id="nav-dashboard">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="9" x="3" y="3" rx="1"></rect>
            <rect width="7" height="5" x="14" y="3" rx="1"></rect>
            <rect width="7" height="9" x="14" y="12" rx="1"></rect>
            <rect width="7" height="5" x="3" y="16" rx="1"></rect>
          </svg>
        </span>
        Dashboard
      </a>
      <a href="#" class="nav-item" onclick="showPage('skills',this)" id="nav-skills">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </span>
        My Skills
      </a>
      <a href="#" class="nav-item" onclick="showPage('roles',this)" id="nav-roles">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </span>
        Career Roles
      </a>
      <a href="#" class="nav-item" onclick="showPage('roadmap',this)" id="nav-roadmap">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
            <line x1="9" x2="9" y1="3" y2="18"></line>
            <line x1="15" x2="15" y1="6" y2="21"></line>
          </svg>
        </span>
        Learning Roadmap
      </a>
      <a href="#" class="nav-item" onclick="showPage('analytics',this)" id="nav-analytics">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" x2="18" y1="20" y2="10"></line>
            <line x1="12" x2="12" y1="20" y2="4"></line>
            <line x1="6" x2="6" y1="20" y2="14"></line>
          </svg>
        </span>
        Market Analytics
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-pill" id="user-pill">
        <div class="user-avatar" id="user-avatar">K</div>
        <div class="user-info">
          <span class="user-name" id="sidebar-name">Krithika</span>
          <span class="user-role">Candidate</span>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </aside>

  
  <main class="main-content"></main>
</div>
</body>
</html>
